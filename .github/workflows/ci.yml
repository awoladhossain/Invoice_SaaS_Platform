name: Continuous Integration (CI) Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: invoicesaas_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/invoicesaas_db_test?schema=public"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      COOKIE_SECRET: "test-super-secret-cookie-key"

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Generate Prisma Client
        run: npx prisma generate

      - name: 🗄️ Push Prisma Database Schema
        run: npx prisma db push --skip-generate

      - name: 🔍 Run ESLint Code Audit
        run: npm run lint

      - name: 🧪 Run Unit Tests
        run: npm run test

      - name: 🚀 Run Production Build
        run: npm run build
